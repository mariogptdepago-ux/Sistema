name: Build, sync and deploy Pages
on:
  push:
    branches: ["main"]
    paths:
      - "apps-source/**"
      - "tools/**"
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Construir sitio y detectar HTML
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: python tools/build_site.py
      - name: Sincronizar aplicaciones
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: python tools/sync_manifest.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
